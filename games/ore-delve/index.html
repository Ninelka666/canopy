function drawGuides(lv){
  const targets = [
    { x:lv.dnX, y:lv.dnY, col:'#9fe8ff', tag:'DOWN' },
    { x:lv.upX, y:lv.upY, col:'#ffd27f', tag:'LIFT' },
  ];
  const mL = 74, mR = 74, mT = 210, mB = 160;
  for (const t of targets){
    const wx = t.x * TS + TS / 2, wy = t.y * TS + TS / 2;
    const sx = wx - camX, sy = wy - camY;
    const inside = sx > mL && sx < VW - mR && sy > mT && sy < VH - mB;
    if (inside) continue;
    const cx = VW / 2, cy = (mT + (VH - mB)) / 2;
    const a = Math.atan2(sy - cy, sx - cx);
    const halfW = VW / 2 - mL, halfH = (VH - mB - mT) / 2;
    const rx = halfW / Math.max(1e-3, Math.abs(Math.cos(a)));
    const ry = halfH / Math.max(1e-3, Math.abs(Math.sin(a)));
    const r = Math.min(rx, ry);
    const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
    const dist = Math.round(Math.hypot(t.x - P.x, t.y - P.y));
    ctx.save();
    ctx.translate(px, py);
    ctx.globalAlpha = 0.8;
    ctx.rotate(a);
    ctx.fillStyle = t.col;
    ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-10, -9); ctx.lineTo(-10, 9); ctx.closePath(); ctx.fill();
    ctx.rotate(-a);
    ctx.font = 'bold 11px ui-monospace,monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    ctx.fillRect(-26, 14, 52, 16);
    ctx.fillStyle = t.col;
    ctx.fillText(t.tag + ' ' + dist, 0, 23);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawFlashes(){
  if (G.hurtFlash > 0.01){
    ctx.fillStyle = 'rgba(255,40,40,' + (G.hurtFlash * 0.28).toFixed(3) + ')';
    ctx.fillRect(0, 0, VW, VH);
  }
  if (G.goldFlash > 0.01){
    ctx.fillStyle = 'rgba(255,200,90,' + (G.goldFlash * 0.09).toFixed(3) + ')';
    ctx.fillRect(0, 0, VW, VH);
  }
  /* vignette */
  const g = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.3, VW / 2, VH / 2, VH * 0.82);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
}

/* ------------------------------------------------------------------ map -- */
function drawMap(lv){
  const s = 9, mw = lv.w * s, mh = lv.h * s;
  const x0 = VW / 2 - mw / 2, y0 = VH / 2 - mh / 2;
  panel(x0 - 18, y0 - 44, mw + 36, mh + 74, 0.93);
  ctx.textAlign = 'center';
  ctx.font = 'bold 15px ui-monospace,monospace';
  ctx.fillStyle = '#9fe8ff';
  ctx.fillText('DEPTH ' + G.depth + ' — ' + depthName(G.depth).toUpperCase(), VW / 2, y0 - 24);
  for (let y = 0; y < lv.h; y++) for (let x = 0; x < lv.w; x++){
    const i = y * lv.w + x;
    if (!lv.seen[i]) continue;
    const t = lv.type[i];
    let c = '#1b1f28';
    if (t === T_FLOOR) c = '#39414f';
    else if (t === T_DIRT) c = '#5a4028';
    else if (t === T_STONE) c = '#4a4f5c';
    else if (t === T_ORE) c = ORE[lv.ore[i]] ? ORE[lv.ore[i]].color : '#888';
    else if (t === T_LAVA) c = '#ff7a33';
    else if (t === T_CRYSTAL) c = '#7fd8ff';
    else if (t === T_DOWN) c = '#9fe8ff';
    else if (t === T_LIFT) c = '#ffd27f';
    else if (t === T_BEDROCK) c = '#0a0b10';
    ctx.fillStyle = c;
    ctx.fillRect(x0 + x * s, y0 + y * s, s, s);
  }
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x0 + P.x * s - 1, y0 + P.y * s - 1, s + 2, s + 2);
  ctx.font = '12px ui-monospace,monospace';
  ctx.fillStyle = '#8d97ae';
  ctx.fillText('M to close · white = you · amber = lift up · cyan = stairs down', VW / 2, y0 + mh + 18);
}

/* ----------------------------------------------------------------- menu -- */
function drawMenu(){
  const menu = buildMenu();
  if (!menu) return;
  ctx.fillStyle = 'rgba(4,5,10,.74)';
  ctx.fillRect(0, 0, VW, VH);

  const rowH = 54, w = 860;
  const maxRows = Math.max(3, Math.floor((VH - 300) / rowH));
  const total = menu.rows.length;
  const view = Math.min(total, maxRows);
  let first = clamp(G.menuIndex - (view >> 1), 0, Math.max(0, total - view));
  const shown = menu.rows.slice(first, first + view);
  const h = 150 + view * rowH + 48;
  const x = VW / 2 - w / 2, y = clamp(VH / 2 - h / 2, 30, VH - h - 20);
  panel(x, y, w, h, 0.96);

  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 30px ui-monospace,monospace';
  ctx.fillStyle = '#ffc14d';
  ctx.fillText(menu.title, x + 36, y + 48);
  ctx.textAlign = 'right';
  ctx.font = 'bold 20px ui-monospace,monospace';
  ctx.fillStyle = '#6ee7a0';
  ctx.fillText('$' + G.money.toLocaleString('en-US'), x + w - 36, y + 48);
  ctx.textAlign = 'left';
  ctx.font = '13px ui-monospace,monospace';
  ctx.fillStyle = '#8d97ae';
  wrapText(menu.sub || '', x + 36, y + 84, w - 72, 18);

  G.menuRects = [];
  let ry = y + 120;
  shown.forEach((r, k) => {
    const i = first + k;
    const sel = i === G.menuIndex;
    G.menuRects.push({ x:x + 24, y:ry, w:w - 48, h:rowH - 8, i });
    if (sel){
      ctx.fillStyle = 'rgba(95,208,255,.13)';
      roundRect(x + 24, ry, w - 48, rowH - 8, 8); ctx.fill();
      ctx.strokeStyle = 'rgba(95,208,255,.55)'; ctx.lineWidth = 1;
      roundRect(x + 24, ry, w - 48, rowH - 8, 8); ctx.stroke();
      ctx.fillStyle = '#5fd0ff';
      ctx.fillRect(x + 24, ry + 8, 3, rowH - 24);
    }
    ctx.textAlign = 'left';
    ctx.font = 'bold 16px ui-monospace,monospace';
    ctx.fillStyle = r.dim ? '#5b6377' : (r.color || '#e7ecf5');
    ctx.fillText(r.label, x + 44, ry + (r.sub ? 17 : rowH / 2 - 4));
    if (r.sub){
      ctx.font = '12px ui-monospace,monospace';
      ctx.fillStyle = '#7d879c';
      ctx.fillText(r.sub, x + 44, ry + 36);
    }
    if (r.right){
      ctx.textAlign = 'right';
      ctx.font = 'bold 16px ui-monospace,monospace';
      ctx.fillStyle = r.dim ? '#5b6377' : '#ffc14d';
      ctx.fillText(r.right, x + w - 44, ry + rowH / 2 - 4);
    }
    ry += rowH;
  });

  ctx.textAlign = 'center';
  ctx.font = '12px ui-monospace,monospace';
  ctx.fillStyle = '#7d879c';
  let foot = menu.foot || '';
  if (total > view) foot += '   ·   ' + (G.menuIndex + 1) + '/' + total;
  ctx.fillText(foot, VW / 2, y + h - 24);
  if (first > 0){
    ctx.fillStyle = '#5fd0ff'; ctx.fillText('▲', VW / 2, y + 110);
  }
  if (first + view < total){
    ctx.fillStyle = '#5fd0ff'; ctx.fillText('▼', VW / 2, y + h - 44);
  }
}
function wrapText(text, x, y, maxW, lh){
  const words = String(text).split(' ');
  let line = '', yy = y;
  for (const wd of words){
    const test = line ? line + ' ' + wd : wd;
    if (ctx.measureText(test).width > maxW && line){
      ctx.fillText(line, x, yy); line = wd; yy += lh;
    } else line = test;
  }
  if (line) ctx.fillText(line, x, yy);
}

/* =========================================================================
   SOUND (tiny synthesised blips, no assets)
   ========================================================================= */
let AC = null, muted = false;
function audio(){
  if (!AC){
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ muted = true; }
  }
  return AC;
}
const SFX = {
  dig:  { f:180, to:90,  d:0.07, type:'square',   g:0.05 },
  break:{ f:120, to:40,  d:0.18, type:'sawtooth', g:0.08 },
  pick: { f:680, to:940, d:0.09, type:'triangle', g:0.06 },
  gem:  { f:880, to:1560,d:0.20, type:'triangle', g:0.09 },
  hit:  { f:240, to:120, d:0.10, type:'square',   g:0.07 },
  hurt: { f:200, to:70,  d:0.26, type:'sawtooth', g:0.10 },
  die:  { f:300, to:50,  d:0.80, type:'sawtooth', g:0.12 },
  coin: { f:1040,to:1480,d:0.16, type:'square',   g:0.07 },
  buy:  { f:520, to:820, d:0.14, type:'triangle', g:0.07 },
  ui:   { f:420, to:460, d:0.05, type:'sine',     g:0.05 },
  deny: { f:150, to:110, d:0.14, type:'square',   g:0.06 },
  lift: { f:120, to:420, d:0.45, type:'sine',     g:0.07 },
};
function sfx(name){
  if (muted) return;
  const s = SFX[name]; if (!s) return;
  const ac = audio(); if (!ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = s.type;
    o.frequency.setValueAtTime(s.f, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, s.to), ac.currentTime + s.d);
    g.gain.setValueAtTime(s.g, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + s.d);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + s.d + 0.02);
  } catch(e){ /* audio is a luxury, never a blocker */ }
}

/* =========================================================================
   BOOT / CAPTURE MODES
   ========================================================================= */
const boot     = document.getElementById('boot');
const badge    = document.getElementById('badge');
const badgeTxt = document.getElementById('badgeText');
const badgeStop= document.getElementById('badgeStop');
const saveLine = document.getElementById('saveLine');
const fsWarn   = document.getElementById('fsWarn');

const CAP = { mode:'play', rec:null, chunks:[], frames:0, dir:null, running:false, fpsT:0, fpsN:0, fps:0 };

function fitCanvas(w, h, density){
  cv.width  = Math.round(w * density);
  cv.height = Math.round(h * density);
  SCALE = cv.width / VW;                       // every preset is 16:9
  OFFX = 0; OFFY = 0;
  layout();
}
function layout(){
  const availW = innerWidth, availH = innerHeight;
  const k = Math.min(availW / cv.width, availH / cv.height);
  cv.style.width  = Math.round(cv.width  * k) + 'px';
  cv.style.height = Math.round(cv.height * k) + 'px';
}
addEventListener('resize', () => { if (cv.width) layout(); });

/* ---------------------------------------------------------------- mouse */
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / r.width  * VW;
  mouse.y = (e.clientY - r.top)  / r.height * VH;
});
cv.addEventListener('mousedown', e => {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / r.width  * VW;
  mouse.y = (e.clientY - r.top)  / r.height * VH;
  mouse.click = true;
});

/* ------------------------------------------------------------ new game - */
function freshStart(){
  G.money = 60; G.maxDepth = 1; G.inv = {}; G.depth = 0;
  for (const k of UP_KEYS) G.up[k] = 0;
  G.stats = { mined:0, earned:0, deaths:0, kills:0, deepest:0, playtime:0 };
  G.hp = maxHP(); G.food = maxFood(); G.water = maxWater();
  G.town = makeTown();
  G.seenIntro = false;
  goTown();
  G.overlay = 'intro'; G.menuIndex = 0;
}

/* ------------------------------------------------------------- the loop */
let lastT = 0, acc = 0;
function frameLoop(now){
  if (!CAP.running || CAP.mode === 'export') return;
  requestAnimationFrame(frameLoop);
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  dt = Math.min(dt, 0.1);
  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 6){ step(STEP); acc -= STEP; }
  render();

  CAP.fpsN++; CAP.fpsT += dt;
  if (CAP.fpsT >= 0.5){ CAP.fps = Math.round(CAP.fpsN / CAP.fpsT); CAP.fpsN = 0; CAP.fpsT = 0; }
  if (CAP.mode === 'record' && CAP.rec && CAP.rec.state === 'recording'){
    const secs = (performance.now() - CAP.recStart) / 1000;
    badgeTxt.textContent = 'REC ' + CAP.fps + ' fps · ' + fmtClock(secs) + ' · ' + CAP.codec;
  }
}
function fmtClock(s){
  const m = Math.floor(s / 60);
  return String(m).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
}

/* --------------------------------------------------- MediaRecorder path */
function startRecording(){
  const prefs = [
    'video/mp4;codecs=avc1.640028',
    'video/mp4;codecs=avc1.4d002a',
    'video/mp4;codecs=avc1.42E01E',
    'video/mp4',
    'video/webm;codecs=h264',
    'video/x-matroska;codecs=avc1',
    'video/webm;codecs=vp9',
    'video/webm',
  ];
  let mime = '';
  for (const m of prefs){
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)){ mime = m; break; }
  }
  if (!window.MediaRecorder){ alert('MediaRecorder is not available in this browser — falling back to PLAY.'); return false; }
  const stream = cv.captureStream(60);
  try {
    CAP.rec = new MediaRecorder(stream, {
      mimeType: mime || undefined,
      videoBitsPerSecond: 48_000_000,
    });
  } catch(e){
    try { CAP.rec = new MediaRecorder(stream); } catch(e2){ alert('Recording failed to start.'); return false; }
  }
  CAP.codec = (mime.includes('mp4') || mime.includes('h264') || mime.includes('avc1')) ? 'H.264' : 'VP9/WebM';
  CAP.chunks = [];
  CAP.rec.ondataavailable = e => { if (e.data && e.data.size) CAP.chunks.push(e.data); };
  const rec = CAP.rec;
  rec.onstop = () => {
    const type = rec.mimeType || mime || 'video/webm';
    const blob = new Blob(CAP.chunks, { type });
    const ext = type.includes('mp4') ? 'mp4' : type.includes('matroska') ? 'mkv' : 'webm';
    downloadBlob(blob, 'ore-delve-' + Date.now() + '.' + ext);
    CAP.rec = null;
    badge.style.display = 'none';
  };
  CAP.rec.start(1000);
  CAP.recStart = performance.now();
  badge.style.display = 'flex';
  badgeTxt.textContent = 'REC · ' + CAP.codec;
  return true;
}
function downloadBlob(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

/* ------------------------------------------- deterministic PNG sequence */
async function exportLoop(){
  badge.style.display = 'flex';
  const t0 = performance.now();
  while (CAP.running){
    step(STEP);                         // exactly 1/60 s of simulation
    render();
    const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
    if (!blob) break;
    const name = 'frame_' + String(CAP.frames).padStart(6, '0') + '.png';
    try {
      const fh = await CAP.dir.getFileHandle(name, { create:true });
      const ws = await fh.createWritable();
      await ws.write(blob);
      await ws.close();
    } catch(e){
      alert('Frame export stopped: ' + e.message);
      break;
    }
    CAP.frames++;
    const wall = (performance.now() - t0) / 1000;
    badgeTxt.textContent = 'EXPORT ' + CAP.frames + ' frames · ' +
      fmtClock(CAP.frames / 60) + ' video · ' + (CAP.frames / Math.max(wall, 0.001)).toFixed(1) + ' fps write';
  }
  badge.style.display = 'none';
}

function stopCapture(){
  if (CAP.mode === 'record' && CAP.rec && CAP.rec.state !== 'inactive'){
    badgeTxt.textContent = 'SAVING…';
    CAP.rec.stop();                 // onstop releases CAP.rec and downloads the file
  }
  if (CAP.mode === 'export'){ CAP.running = false; }
  saveGame();
}
badgeStop.addEventListener('click', stopCapture);

/* --------------------------------------------------------------- start */
async function start(mode){
  const [rw, rh] = document.getElementById('res').value.split('x').map(Number);
  const dsel = document.getElementById('dpr').value;
  const density = dsel === 'auto' ? Math.min(devicePixelRatio || 1, 3) : Number(dsel);
  G.seedText = (document.getElementById('seed').value || '1337').trim();
  RNG = mulberry32(hashStr(G.seedText));

  fitCanvas(rw, rh, density);

  const saved = readSave();
  if (saved && document.getElementById('cont') && document.getElementById('cont').checked){
    loadGame(saved);
    G.town = makeTown();
    goTown();
    if (!G.seenIntro){ G.overlay = 'intro'; G.menuIndex = 0; }
    msg('Welcome back — $' + G.money + ', best depth ' + G.maxDepth, '#6ee7a0');
  } else {
    freshStart();
  }

  CAP.mode = mode; CAP.frames = 0; CAP.running = true;
  audio();

  if (mode === 'export'){
    if (!window.showDirectoryPicker){
      alert('File System Access is unavailable here (needs Chrome/Edge over https or localhost). Running in PLAY mode instead.');
      CAP.mode = 'play';
    } else {
      try { CAP.dir = await window.showDirectoryPicker({ mode:'readwrite' }); }
      catch(e){ alert('No folder picked — running in PLAY mode.'); CAP.mode = 'play'; }
    }
  }
  if (CAP.mode === 'record' && !startRecording()) CAP.mode = 'play';

  boot.style.display = 'none';
  lastT = 0; acc = 0;

  if (CAP.mode === 'export'){ render(); exportLoop(); }
  else requestAnimationFrame(frameLoop);
}

/* -------------------------------------------------------- boot panel UI */
(function initBoot(){
  const saved = readSave();
  if (saved){
    const when = new Date(saved.when || Date.now());
    saveLine.innerHTML =
      '<span class="chip">SAVE FOUND</span>' +
      '<label style="display:flex;align-items:center;gap:6px;margin:0;text-transform:none;letter-spacing:0;color:#e7ecf5;font-size:12px">' +
      '<input type="checkbox" id="cont" checked style="width:auto"> continue this run</label>' +
      '<span>$' + (saved.money | 0) + ' · best depth ' + (saved.maxDepth | 0) +
      ' · saved ' + when.toLocaleString() + '</span>';
  } else {
    saveLine.innerHTML = '<span style="color:#8d97ae;font-size:12px">No save yet — a new mine will be dug for you.</span>';
  }
  if (!window.showDirectoryPicker)
    fsWarn.textContent = 'Note: PNG frame export needs the File System Access API (Chrome / Edge, https or localhost).';
  document.querySelectorAll('.mode').forEach(b => {
    b.addEventListener('click', () => start(b.dataset.mode));
  });
  document.getElementById('seed').addEventListener('keydown', e => {
    if (e.key === 'Enter') start('play');
  });
})();
</script>
